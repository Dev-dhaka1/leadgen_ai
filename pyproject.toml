[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen_ai"
version = "0.1.0"
description = "A CrewAI-based Lead Generation and Cold Outreach AI system"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai>=0.130.0",
    "crewai-tools>=0.45.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "schedule>=1.2.0",
]

[project.scripts]
leadgen = "leadgen_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]